name: Documentation quality

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/dependabot.yml"
      - ".github/workflows/documentation-quality.yml"
      - ".markdownlint-cli2.jsonc"
      - "config/**"
      - "install-sdd.sh"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "skills/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/dependabot.yml"
      - ".github/workflows/documentation-quality.yml"
      - ".markdownlint-cli2.jsonc"
      - "config/**"
      - "install-sdd.sh"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "skills/**"
      - "tests/**"
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: documentation-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-quality:
    name: Blocking documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Run changed-file and changed-line checks
        if: github.event_name == 'pull_request'
        env:
          SDD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run docs:fast -- "$SDD_BASE_SHA" HEAD

      - name: Run full checks and their negative regression tests
        if: github.event_name != 'pull_request'
        run: npm run docs:all

      - name: Check external links (advisory)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npm run docs:links:external
