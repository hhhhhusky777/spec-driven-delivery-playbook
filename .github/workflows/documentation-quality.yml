name: Documentation quality

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/dependabot.yml"
      - ".github/workflows/documentation-quality.yml"
      - ".markdownlint-cli2.jsonc"
      - "config/**"
      - "install-sdd.sh"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "skills/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/dependabot.yml"
      - ".github/workflows/documentation-quality.yml"
      - ".markdownlint-cli2.jsonc"
      - "config/**"
      - "install-sdd.sh"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "skills/**"
      - "tests/**"
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      evidence_mode:
        description: "Optional PR evidence gate: PRE_MERGE or RESET_READY"
        required: false
        type: string
      evidence_pr:
        description: "Pull request number for the evidence gate"
        required: false
        type: string
      evidence_head:
        description: "Exact full candidate SHA for the evidence gate"
        required: false
        type: string
      evidence_base:
        description: "Exact full target-base SHA for the evidence gate"
        required: false
        type: string
      evidence_target:
        description: "Exact target branch for the evidence gate"
        required: false
        type: string
      evidence_checks:
        description: "Comma-separated required check names"
        required: false
        type: string
      evidence_owner:
        description: "Expected owner login"
        required: true
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: documentation-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-quality:
    name: Blocking documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Run blocking checks and their negative regression tests
        run: npm run docs:all

      - name: Check external links (advisory)
        continue-on-error: true
        run: npm run docs:links:external

  pr-evidence:
    name: Verify PR evidence
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_mode != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify versioned PR evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVIDENCE_MODE: ${{ inputs.evidence_mode }}
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_PR: ${{ inputs.evidence_pr }}
          EVIDENCE_HEAD: ${{ inputs.evidence_head }}
          EVIDENCE_BASE: ${{ inputs.evidence_base }}
          EVIDENCE_TARGET: ${{ inputs.evidence_target }}
          EVIDENCE_CHECKS: ${{ inputs.evidence_checks }}
          EVIDENCE_OWNER: ${{ inputs.evidence_owner }}
        run: >-
          npm run sdd:evidence --
          --mode "$EVIDENCE_MODE"
          --repository "$EVIDENCE_REPOSITORY"
          --pr "$EVIDENCE_PR"
          --head "$EVIDENCE_HEAD"
          --base "$EVIDENCE_BASE"
          --target "$EVIDENCE_TARGET"
          --checks "$EVIDENCE_CHECKS"
          --owner "$EVIDENCE_OWNER"
